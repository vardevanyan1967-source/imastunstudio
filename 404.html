<!DOCTYPE html>

<style>

body{
  background:#050505;
  color:#f5e7c1;
  font-family:'Cormorant Garamond',Georgia,serif;
  min-height:100vh;
  display:flex;
  align-items:center;

  margin:20px auto;

  font-size:28px;
  color:#d4af37;

}
p{

  font-size:18px;
  line-height:1.8;
  margin-bottom:30px;
}
a{
  display:inline-block;
  padding:14px 32px;
  border-radius:999px;
  background:linear-gradient(135deg,#d4af37,#ffe082);
  color:#000;
  font-size:16px;
  font-weight:bold;
  text-decoration:none;
  letter-spacing:1px;
  transition:.3s;
  box-shadow:0 0 30px rgba(212,175,55,.4);
}
a:hover{
  transform:translateY(-3px);
  box-shadow:0 0 50px rgba(212,175,55,.6);
